<svg width="2195" height="904" viewBox="0 0 2195 904" xmlns="http://www.w3.org/2000/svg" font-family="Arial, 'Segoe UI', sans-serif">
<rect x="0" y="0" width="2195" height="904" fill="#ffffff"/>
<rect x="60" y="64" width="2095" height="110" fill="#eef4ea" stroke="#b9c9b2" stroke-width="1"/>
<rect x="60" y="64" width="170" height="110" fill="#3f6b3f" stroke="#2e502e" stroke-width="1"/>
<text x="145.0" y="119.0" fill="white" font-size="14" font-weight="600" text-anchor="middle" dominant-baseline="middle">
<tspan x="145.0" dy="0.0">Оператор</tspan>
</text>
<rect x="60" y="174" width="2095" height="110" fill="#e4efe0" stroke="#b9c9b2" stroke-width="1"/>
<rect x="60" y="174" width="170" height="110" fill="#3f6b3f" stroke="#2e502e" stroke-width="1"/>
<text x="145.0" y="229.0" fill="white" font-size="14" font-weight="600" text-anchor="middle" dominant-baseline="middle">
<tspan x="145.0" dy="-24.0">geo_engine.io</tspan>
<tspan x="145.0" dy="16">(импорт и</tspan>
<tspan x="145.0" dy="16">очистка</tspan>
<tspan x="145.0" dy="16">геометрии)</tspan>
</text>
<rect x="60" y="344" width="2095" height="110" fill="#eef4ea" stroke="#b9c9b2" stroke-width="1"/>
<rect x="60" y="344" width="170" height="110" fill="#3f6b3f" stroke="#2e502e" stroke-width="1"/>
<text x="145.0" y="399.0" fill="white" font-size="14" font-weight="600" text-anchor="middle" dominant-baseline="middle">
<tspan x="145.0" dy="-16.0">geo_engine</tspan>
<tspan x="145.0" dy="16">(геометрия и</tspan>
<tspan x="145.0" dy="16">отбор)</tspan>
</text>
<rect x="60" y="454" width="2095" height="110" fill="#e4efe0" stroke="#b9c9b2" stroke-width="1"/>
<rect x="60" y="454" width="170" height="110" fill="#3f6b3f" stroke="#2e502e" stroke-width="1"/>
<text x="145.0" y="509.0" fill="white" font-size="14" font-weight="600" text-anchor="middle" dominant-baseline="middle">
<tspan x="145.0" dy="-8.0">ml_scoring</tspan>
<tspan x="145.0" dy="16">(скоринг)</tspan>
</text>
<rect x="60" y="564" width="2095" height="110" fill="#eef4ea" stroke="#b9c9b2" stroke-width="1"/>
<rect x="60" y="564" width="170" height="110" fill="#3f6b3f" stroke="#2e502e" stroke-width="1"/>
<text x="145.0" y="619.0" fill="white" font-size="14" font-weight="600" text-anchor="middle" dominant-baseline="middle">
<tspan x="145.0" dy="-16.0">geo_engine.compliance</tspan>
<tspan x="145.0" dy="16">/ io (проверка и</tspan>
<tspan x="145.0" dy="16">вывод)</tspan>
</text>
<rect x="60" y="734" width="2095" height="110" fill="#eef4ea" stroke="#b9c9b2" stroke-width="1"/>
<rect x="60" y="734" width="170" height="110" fill="#3f6b3f" stroke="#2e502e" stroke-width="1"/>
<text x="145.0" y="789.0" fill="white" font-size="14" font-weight="600" text-anchor="middle" dominant-baseline="middle">
<tspan x="145.0" dy="-8.0">Итоговый</tspan>
<tspan x="145.0" dy="16">комплект</tspan>
</text>
<text x="60" y="54" font-size="17" font-weight="700" fill="#22381f">Этап 1. Загрузка и подготовка данных</text>
<text x="60" y="334" font-size="17" font-weight="700" fill="#22381f">Этап 2. Генерация плана, скоринг, проверка нормативов и экспорт</text>
<defs><marker id="arrowhead" markerWidth="10" markerHeight="8" refX="8" refY="4" orient="auto"><polygon points="0 0, 10 4, 0 8" fill="#2e4a2c"/></marker></defs>
<rect x="232.5" y="74.0" width="190" height="90" rx="45.0" ry="45.0" fill="#2e7d32" stroke="#1b5e20" stroke-width="2"/>
<text x="327.5" y="119.0" font-size="12.3" fill="white" text-anchor="middle" font-weight="600">
<tspan x="327.5" dy="-15.3">Оператор запускает</tspan>
<tspan x="327.5" dy="15.3">scripts/plan_dxf.py</tspan>
<tspan x="327.5" dy="15.3">--input чертёж/папка</tspan>
</text>
<rect x="457.5" y="191.0" width="210" height="76" rx="10" ry="10" fill="#ffffff" stroke="#3f6b3f" stroke-width="1.6"/>
<text x="562.5" y="229.0" font-size="12.3" fill="#1a2e17" text-anchor="middle" font-weight="500">
<tspan x="562.5" dy="-15.3">Найти главный чертёж</tspan>
<tspan x="562.5" dy="15.3">и связанные файлы</tspan>
<tspan x="562.5" dy="15.3">(resolve_bundle_inputs)</tspan>
</text>
<rect x="692.5" y="191.0" width="210" height="76" rx="10" ry="10" fill="#ffffff" stroke="#3f6b3f" stroke-width="1.6"/>
<text x="797.5" y="229.0" font-size="12.3" fill="#1a2e17" text-anchor="middle" font-weight="500">
<tspan x="797.5" dy="-15.3">Если вход DWG --</tspan>
<tspan x="797.5" dy="15.3">конвертировать в DXF</tspan>
<tspan x="797.5" dy="15.3">(ODA / LibreDWG)</tspan>
</text>
<rect x="927.5" y="191.0" width="210" height="76" rx="10" ry="10" fill="#ffffff" stroke="#3f6b3f" stroke-width="1.6"/>
<text x="1032.5" y="229.0" font-size="12.3" fill="#1a2e17" text-anchor="middle" font-weight="500">
<tspan x="1032.5" dy="-22.950000000000003">Прочитать сущности,</tspan>
<tspan x="1032.5" dy="15.3">развернуть блоки,</tspan>
<tspan x="1032.5" dy="15.3">классифицировать слои</tspan>
<tspan x="1032.5" dy="15.3">(dxf_reader + layer_rules)</tspan>
</text>
<rect x="1162.5" y="191.0" width="210" height="76" rx="10" ry="10" fill="#ffffff" stroke="#3f6b3f" stroke-width="1.6"/>
<text x="1267.5" y="229.0" font-size="12.3" fill="#1a2e17" text-anchor="middle" font-weight="500">
<tspan x="1267.5" dy="-30.6">Очистить геометрию:</tspan>
<tspan x="1267.5" dy="15.3">сшить пунктир сетей,</tspan>
<tspan x="1267.5" dy="15.3">замкнуть контуры</tspan>
<tspan x="1267.5" dy="15.3">(building/road/lawn),</tspan>
<tspan x="1267.5" dy="15.3">разобрать HATCH/REGION/ARC</tspan>
</text>
<rect x="1397.5" y="191.0" width="210" height="76" rx="10" ry="10" fill="#ffffff" stroke="#3f6b3f" stroke-width="1.6"/>
<text x="1502.5" y="229.0" font-size="12.3" fill="#1a2e17" text-anchor="middle" font-weight="500">
<tspan x="1502.5" dy="-15.3">Построить полигон</tspan>
<tspan x="1502.5" dy="15.3">границы участка</tspan>
<tspan x="1502.5" dy="15.3">(territory_polygon)</tspan>
</text>
<polygon points="1737.5,189.1 1795.25,229.0 1737.5,268.9 1679.75,229.0" fill="#f6c343" stroke="#a8790a" stroke-width="2"/>
<text x="1737.5" y="229.0" font-size="12.3" fill="#3a2a00" text-anchor="middle" font-weight="500">
<tspan x="1737.5" dy="-15.3">Граница</tspan>
<tspan x="1737.5" dy="15.3">участка</tspan>
<tspan x="1737.5" dy="15.3">найдена?</tspan>
</text>
<rect x="1877.5" y="184.0" width="190" height="90" rx="45.0" ry="45.0" fill="#8d1f1f" stroke="#5c1111" stroke-width="3"/>
<text x="1972.5" y="229.0" font-size="12.3" fill="white" text-anchor="middle" font-weight="600">
<tspan x="1972.5" dy="-15.3">Ошибка:</tspan>
<tspan x="1972.5" dy="15.3">MissingTerritoryError,</tspan>
<tspan x="1972.5" dy="15.3">план не строится</tspan>
</text>
<rect x="222.5" y="361.0" width="210" height="76" rx="10" ry="10" fill="#ffffff" stroke="#3f6b3f" stroke-width="1.6"/>
<text x="327.5" y="399.0" font-size="12.3" fill="#1a2e17" text-anchor="middle" font-weight="500">
<tspan x="327.5" dy="-30.6">Для каждой породы:</tspan>
<tspan x="327.5" dy="15.3">зона отступов</tspan>
<tspan x="327.5" dy="15.3">с поправками по норме</tspan>
<tspan x="327.5" dy="15.3">(build_exclusion_zone +</tspan>
<tspan x="327.5" dy="15.3">resolve_setback)</tspan>
</text>
<rect x="457.5" y="361.0" width="210" height="76" rx="10" ry="10" fill="#ffffff" stroke="#3f6b3f" stroke-width="1.6"/>
<text x="562.5" y="399.0" font-size="12.3" fill="#1a2e17" text-anchor="middle" font-weight="500">
<tspan x="562.5" dy="-22.950000000000003">buildable_area =</tspan>
<tspan x="562.5" dy="15.3">территория - препятствия</tspan>
<tspan x="562.5" dy="15.3">- отступы - отступ</tspan>
<tspan x="562.5" dy="15.3">от границы участка</tspan>
</text>
<rect x="692.5" y="361.0" width="210" height="76" rx="10" ry="10" fill="#ffffff" stroke="#3f6b3f" stroke-width="1.6"/>
<text x="797.5" y="399.0" font-size="12.3" fill="#1a2e17" text-anchor="middle" font-weight="500">
<tspan x="797.5" dy="-30.6">Сгенерировать кандидатов:</tspan>
<tspan x="797.5" dy="15.3">ряд вдоль улицы,</tspan>
<tspan x="797.5" dy="15.3">группы-куртины,</tspan>
<tspan x="797.5" dy="15.3">россыпь на остатке</tspan>
<tspan x="797.5" dy="15.3">(patterns.py)</tspan>
</text>
<rect x="927.5" y="471.0" width="210" height="76" rx="10" ry="10" fill="#ffffff" stroke="#3f6b3f" stroke-width="1.6"/>
<text x="1032.5" y="509.0" font-size="12.3" fill="#1a2e17" text-anchor="middle" font-weight="500">
<tspan x="1032.5" dy="-22.950000000000003">Оценить кандидатов:</tspan>
<tspan x="1032.5" dy="15.3">HeuristicScorer</tspan>
<tspan x="1032.5" dy="15.3">(прозрачная формула)</tspan>
<tspan x="1032.5" dy="15.3">или MLScorer</tspan>
</text>
<rect x="1162.5" y="361.0" width="210" height="76" rx="10" ry="10" fill="#ffffff" stroke="#3f6b3f" stroke-width="1.6"/>
<text x="1267.5" y="399.0" font-size="12.3" fill="#1a2e17" text-anchor="middle" font-weight="500">
<tspan x="1267.5" dy="-22.950000000000003">Жадный отбор без</tspan>
<tspan x="1267.5" dy="15.3">пересечения крон</tspan>
<tspan x="1267.5" dy="15.3">и интервалов</tspan>
<tspan x="1267.5" dy="15.3">(greedy_select)</tspan>
</text>
<rect x="1397.5" y="581.0" width="210" height="76" rx="10" ry="10" fill="#ffffff" stroke="#3f6b3f" stroke-width="1.6"/>
<text x="1502.5" y="619.0" font-size="12.3" fill="#1a2e17" text-anchor="middle" font-weight="500">
<tspan x="1502.5" dy="-22.950000000000003">Проверить фактические</tspan>
<tspan x="1502.5" dy="15.3">отступы, найти</tspan>
<tspan x="1502.5" dy="15.3">цитируемый пункт НПА</tspan>
<tspan x="1502.5" dy="15.3">(compliance.explain_items)</tspan>
</text>
<polygon points="1737.5,579.1 1795.25,619.0 1737.5,658.9 1679.75,619.0" fill="#f6c343" stroke="#a8790a" stroke-width="2"/>
<text x="1737.5" y="619.0" font-size="12.3" fill="#3a2a00" text-anchor="middle" font-weight="500">
<tspan x="1737.5" dy="-15.3">Есть</tspan>
<tspan x="1737.5" dy="15.3">нарушения</tspan>
<tspan x="1737.5" dy="15.3">норматива?</tspan>
</text>
<rect x="1877.5" y="574.0" width="190" height="90" rx="10" ry="10" fill="#ffffff" stroke="#3f6b3f" stroke-width="1.6"/>
<text x="1972.5" y="619.0" font-size="12.3" fill="#1a2e17" text-anchor="middle" font-weight="500">
<tspan x="1972.5" dy="-15.3">Пометить нарушения</tspan>
<tspan x="1972.5" dy="15.3">в отчёте,</tspan>
<tspan x="1972.5" dy="15.3">код возврата = 1</tspan>
</text>
<rect x="1857.5" y="751.0" width="230" height="76" rx="10" ry="10" fill="#ffffff" stroke="#3f6b3f" stroke-width="1.6"/>
<text x="1972.5" y="789.0" font-size="12.3" fill="#1a2e17" text-anchor="middle" font-weight="500">
<tspan x="1972.5" dy="-30.6">Записать DXF:</tspan>
<tspan x="1972.5" dy="15.3">копия исходника +</tspan>
<tspan x="1972.5" dy="15.3">слои GREEN_AI$...,</tspan>
<tspan x="1972.5" dy="15.3">обоснование как XDATA</tspan>
<tspan x="1972.5" dy="15.3">на каждом объекте</tspan>
</text>
<rect x="1223.0" y="751.0" width="230" height="76" rx="10" ry="10" fill="#ffffff" stroke="#3f6b3f" stroke-width="1.6"/>
<text x="1338.0" y="789.0" font-size="12.3" fill="#1a2e17" text-anchor="middle" font-weight="500">
<tspan x="1338.0" dy="-30.6">Сформировать</tspan>
<tspan x="1338.0" dy="15.3">report.json + trace.csv</tspan>
<tspan x="1338.0" dy="15.3">(координаты, порода,</tspan>
<tspan x="1338.0" dy="15.3">все отступы, ссылка</tspan>
<tspan x="1338.0" dy="15.3">на акт и пункт)</tspan>
</text>
<rect x="518.0" y="739.0" width="230" height="100" rx="50.0" ry="50.0" fill="#1b4d8f" stroke="#0d2f5c" stroke-width="3"/>
<text x="633.0" y="789.0" font-size="12.3" fill="white" text-anchor="middle" font-weight="600">
<tspan x="633.0" dy="-22.950000000000003">Результат:</tspan>
<tspan x="633.0" dy="15.3">DXF (план поверх исходника)</tspan>
<tspan x="633.0" dy="15.3">+ JSON/CSV с обоснованием</tspan>
<tspan x="633.0" dy="15.3">+ код возврата 0/1</tspan>
</text>
