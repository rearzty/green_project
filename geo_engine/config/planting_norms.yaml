# Нормативные отступы посадок от инженерных сетей и параметры посадок.
#
# КАЖДОЕ значение отступа обязано иметь запись в setback_sources -> sources.
# Это требование ТЗ, а не аккуратность ради аккуратности: «объяснение
# обязательно содержит ссылку на нормативный акт и конкретный пункт / таблицу /
# норму отступа», «"чёрный ящик" без привязки к нормам не принимается».
# Связность проверяется тестом (tests/test_geo_engine/test_norms.py).
#
# Каждый источник несёт флаг verified:
#   verified: true  — значение сверено с текстом самого акта;
#   verified: false — значение ещё не сверено (взято из текста ТЗ, из
#                     инженерной практики или из вторичного источника).
# Непроверенные источники не прячутся: compliance.py помечает их в объяснении,
# и CLI выводит по ним сводку. Выдавать догадку за норму хуже, чем признать
# пробел.

sources:
  sp42_t9_1:
    act: "СП 42.13330.2016"
    act_full: "Градостроительство. Планировка и застройка городских и сельских поселений (актуализированная редакция СНиП 2.07.01-89*, с Изм. N 1-4)"
    clause: "п. 9.6, таблица 9.1"
    title: "Расстояние от зданий и сооружений, а также объектов инженерного благоустройства до деревьев и кустарников"
    verified: true
    note: >-
      Сверено с полным текстом СП. Таблица нормирует расстояния только до оси
      ствола дерева и до кустарника; травяного покрова в ней нет вовсе.
      Примечание 1 к таблице: нормы относятся к деревьям с диаметром кроны не
      более 5 м и должны быть увеличены для более крупных крон.

  sp42_t9_1_not_regulated:
    act: "СП 42.13330.2016"
    act_full: "Градостроительство. Планировка и застройка городских и сельских поселений"
    clause: "п. 9.6, таблица 9.1"
    title: "Расстояние до кустарника не нормируется (в таблице прочерк)"
    verified: false
    note: >-
      Сверено, что в соответствующей строке таблицы 9.1 для кустарника стоит
      прочерк — это «не нормируется», а не «можно вплотную». Но само
      применяемое значение нормативом не задано и взято из практики, поэтому
      verified=false: флаг относится к значению, а не к факту наличия
      прочерка. Иначе эксперт прочитал бы цитату «табл. 9.1» рядом с числом
      как будто таблица это число и предписывает.

  ppm_743_t3_6_1:
    act: "Постановление Правительства Москвы № 743-ПП от 10.09.2002 (ред. от 05.06.2024)"
    act_full: "Об утверждении Правил создания, содержания и охраны зеленых насаждений и природных сообществ города Москвы"
    clause: "п. 3.6.3, таблица 3.6.1"
    title: "Расстояние от сооружений до посадок растений (по МГСН 1.01-99)"
    verified: true
    note: >-
      Сверено с текстом акта. Московская таблица по составу шире федеральной
      (СП 42.13330.2016, табл. 9.1): в ней есть отдельная строка про школы и
      детские сады и про подошву откоса, которых в СП нет.
      ВАЖНО, из-за чего здесь однажды ошиблись: формулировка ТЗ «743-ПП —
      отступы от трубопроводов, например, не менее 2 метров» относится к
      строке «теплопровод, трубопровод, теплосеть 2,0», а НЕ к газопроводу.
      По газопроводу оба акта дают 1,5 м, расхождения между ними нет, и
      завышенное значение 2,0 было нашей собственной ошибкой, а не
      требованием более строгого местного акта.

  ppm_743_t3_6_1_note3:
    act: "Постановление Правительства Москвы № 743-ПП от 10.09.2002"
    act_full: "Об утверждении Правил создания, содержания и охраны зеленых насаждений и природных сообществ города Москвы"
    clause: "п. 3.6.3, таблица 3.6.1, примечание 3"
    title: "Деревья с широкой кроной, затеняющие жилые помещения, — не ближе 10 м от здания"
    verified: true
    note: >-
      Дословно: «Деревья с широкой кроной (липа, клен, дуб, каштан, тополь и
      др.), затеняющие жилые помещения, должны сажаться не ближе 10 м от
      здания». Правило зависит от ПОРОДЫ, а не только от типа посадки —
      применяется через species.yaml (признак shades_windows).

  ppm_743_t3_6_2:
    act: "Постановление Правительства Москвы № 743-ПП от 10.09.2002"
    act_full: "Об утверждении Правил создания, содержания и охраны зеленых насаждений и природных сообществ города Москвы"
    clause: "п. 3.6.4, таблица 3.6.2"
    title: "Ориентировочные расстояния между деревьями и кустарниками на магистралях"
    verified: true
    note: >-
      Однорядная посадка деревьев 5-6 м, двухрядная 7-8 м, групповая 5-7 м;
      кустарники высокие (>1,8 м) однорядно 0,5-1 м, средние и низкие
      0,3-0,4 м, групповая посадка кустарников 0,3 м.

  mgsn_1_02_02_4_2_8:
    act: "МГСН 1.02-02 (ТСН 30-307-2002 г. Москвы)"
    act_full: "Нормы и правила проектирования комплексного благоустройства на территории города Москвы"
    clause: "п. 4.2.8"
    title: "Отступ от теплотрассы зависит от породы дерева"
    verified: true
    note: >-
      Дословно: «У теплотрасс не следует размещать: липу, клен, сирень,
      жимолость — ближе 2 м, тополь, боярышник, кизильник, дерен,
      лиственницу, березу — ближе 3-4 м». Там же про прогрев почвы от оси
      теплотрассы: интенсивный до 2 м, средний 2-6 м, слабый 6-10 м.
      Применяется через species.yaml (heat_network_min_m).

  mgsn_1_02_02_4_2_9_2:
    act: "МГСН 1.02-02 (ТСН 30-307-2002 г. Москвы)"
    act_full: "Нормы и правила проектирования комплексного благоустройства на территории города Москвы"
    clause: "п. 4.2.9.2"
    title: "Расстояние между стволами взрослых деревьев по ширине кроны"
    verified: true
    note: >-
      Дословно: «расстояния между стволами взрослых деревьев 8-10 м (с
      широкой кроной), 5-6 м (со средней кроной), 3-4 м (с узкой кроной),
      подкроновое пространство следует заполнять рядами кустарника».
      Норма дана для шумозащитных рядовых посадок, но это единственный
      доступный нормативный ориентир интервала по классу кроны — берётся
      нижняя граница каждого диапазона, см. species.yaml.

  ppm_369_invasive:
    act: "Постановление Правительства Москвы № 369-ПП от 03.03.2026"
    act_full: "О мерах по регулированию распространения и численности инвазивных растений на территории города Москвы"
    clause: "приложение 1"
    title: "Перечень инвазивных видов растений"
    verified: true
    note: >-
      Четыре группы. Вид из перечня не может быть предложен к посадке —
      проверяется тестом, см. geo_engine/config/species.yaml.
      Отдельно стоит знать: 515-ПП (2017) рекомендует «Розу ругозу» для
      палисадников, а 369-ПП (2026) вносит её же в перечень как «Роза
      морщинистая, Rosa rugosa» — более поздний акт главнее.

  pue_ohrannaya_zona:
    act: "ПУЭ (Правила устройства электроустановок), 6-е и 7-е изд."
    act_full: "Правила устройства электроустановок"
    clause: "пункт не установлен"
    title: "Расстояния от воздушных линий электропередачи до деревьев"
    verified: false
    note: >-
      СП 42.13330.2016, таблица 9.1, примечание 2 прямо отсылает к ПУЭ
      (позиция [10] библиографии СП) вместо собственного норматива. Сам ПУЭ
      не сверялся; значения ниже — ориентировочные.

  practice:
    act: "Инженерная практика (не норматив)"
    act_full: ""
    clause: "—"
    title: "Значение принято из практики, нормативом не установлено"
    verified: false
    note: >-
      Применяется там, где действующие акты величину не задают: газон в
      таблице 9.1 отсутствует как класс, отступ от границы участка тоже не
      нормирован. Ноль был бы неверен практически (нужен доступ к колодцам,
      отмостка вдоль стены), поэтому берутся небольшие ненулевые значения.

# Минимальный отступ (в метрах) от объекта до посадки данного типа.
# Значения для дерева/кустарника — из таблицы 9.1 СП 42.13330.2016, кроме
# явно помеченных. Для газона норматива нет ни в одном из доступных актов.
setbacks_m:
  heat_network:        { tree: 2.0, shrub: 1.0, lawn: 0.3 }   # теплосеть
  water_pipe:          { tree: 2.0, shrub: 1.0, lawn: 0.3 }   # водопровод, дренаж
  sewer:               { tree: 1.5, shrub: 1.0, lawn: 0.3 }   # канализация/водосток
  gas_pipe:            { tree: 1.5, shrub: 1.0, lawn: 0.5 }   # газопровод — 743-ПП и СП совпадают: 1,5 м
  cable_line:          { tree: 2.0, shrub: 0.7, lawn: 0.3 }   # силовой кабель и кабель связи
  power_line_corridor: { tree: 3.0, shrub: 2.0, lawn: 0.0 }   # охранная зона ЛЭП
  building:            { tree: 5.0, shrub: 1.5, lawn: 0.5 }   # наружная стена здания/сооружения
  road:                { tree: 2.0, shrub: 1.0, lawn: 0.3 }   # край проезжей части
  sidewalk:            { tree: 0.7, shrub: 0.5, lawn: 0.0 }   # край тротуара и садовой дорожки
  lighting_pole:       { tree: 4.0, shrub: 1.0, lawn: 0.0 }   # мачта/опора осветительной сети, трамвая, эстакады
  retaining_wall:      { tree: 3.0, shrub: 1.0, lawn: 0.3 }   # подошва или внутренняя грань подпорной стенки
  tram_track:          { tree: 5.0, shrub: 3.0, lawn: 0.3 }   # край трамвайного полотна / ось трамвайных путей
  school_kindergarten: { tree: 10.0, shrub: 1.5, lawn: 0.5 }  # наружная стена школы или детского сада — вдвое строже обычного здания
  slope_toe:           { tree: 1.0, shrub: 0.5, lawn: 0.0 }   # подошва откоса, террасы

# Какой источник обосновывает каждое значение выше. Строка row — дословная
# формулировка строки таблицы 9.1, чтобы эксперт нашёл её глазами в документе.
setback_sources:
  heat_network:
    tree:  { source: sp42_t9_1, row: "Подземные сети: тепловая сеть (стенка канала, тоннеля или оболочка при бесканальной прокладке)" }
    shrub: { source: sp42_t9_1, row: "Подземные сети: тепловая сеть (стенка канала, тоннеля или оболочка при бесканальной прокладке)" }
    lawn:  { source: practice }
  water_pipe:
    tree:  { source: sp42_t9_1, row: "Подземные сети: водопровод, дренаж" }
    shrub: { source: sp42_t9_1_not_regulated, row: "Подземные сети: водопровод, дренаж (для кустарника — прочерк)" }
    lawn:  { source: practice }
  sewer:
    tree:  { source: sp42_t9_1, row: "Подземные сети: газопровод, канализация" }
    shrub: { source: sp42_t9_1_not_regulated, row: "Подземные сети: газопровод, канализация (для кустарника — прочерк)" }
    lawn:  { source: practice }
  gas_pipe:
    tree:  { source: ppm_743_t3_6_1, row: "Подземные коммуникации: газопровод, канализация" }
    shrub: { source: sp42_t9_1_not_regulated, row: "Подземные сети: газопровод, канализация (для кустарника — прочерк)" }
    lawn:  { source: practice }
  cable_line:
    tree:  { source: sp42_t9_1, row: "Подземные сети: силовой кабель и кабель связи" }
    shrub: { source: sp42_t9_1, row: "Подземные сети: силовой кабель и кабель связи" }
    lawn:  { source: practice }
  power_line_corridor:
    tree:  { source: pue_ohrannaya_zona, row: "таблица 9.1, примечание 2: расстояния от ВЛ до деревьев принимать по ПУЭ" }
    shrub: { source: pue_ohrannaya_zona, row: "таблица 9.1, примечание 2: расстояния от ВЛ до деревьев принимать по ПУЭ" }
    lawn:  { source: practice, row: "газон под ЛЭП обычно и есть рекомендуемое покрытие, в отличие от деревьев" }
  building:
    tree:  { source: sp42_t9_1, row: "Наружная стена здания и сооружения" }
    shrub: { source: sp42_t9_1, row: "Наружная стена здания и сооружения" }
    lawn:  { source: practice }
  road:
    tree:  { source: sp42_t9_1, row: "Край проезжей части улиц, кромка укрепленной полосы обочины дороги или бровка канавы" }
    shrub: { source: sp42_t9_1, row: "Край проезжей части улиц, кромка укрепленной полосы обочины дороги или бровка канавы" }
    lawn:  { source: practice }
  sidewalk:
    tree:  { source: sp42_t9_1, row: "Край тротуара и садовой дорожки" }
    shrub: { source: sp42_t9_1, row: "Край тротуара и садовой дорожки" }
    lawn:  { source: practice }
  lighting_pole:
    tree:  { source: sp42_t9_1, row: "Мачта и опора осветительной сети, трамвая, мостовая опора и эстакада" }
    shrub: { source: sp42_t9_1_not_regulated, row: "Мачта и опора осветительной сети, трамвая, мостовая опора и эстакада (для кустарника — прочерк)" }
    lawn:  { source: practice }
  retaining_wall:
    tree:  { source: sp42_t9_1, row: "Подошва или внутренняя грань подпорной стенки" }
    shrub: { source: sp42_t9_1, row: "Подошва или внутренняя грань подпорной стенки" }
    lawn:  { source: practice }
  tram_track:
    tree:  { source: sp42_t9_1, row: "Край трамвайного полотна" }
    shrub: { source: sp42_t9_1, row: "Край трамвайного полотна" }
    lawn:  { source: practice }
  school_kindergarten:
    tree:  { source: ppm_743_t3_6_1, row: "Наружная стена школьного здания или здания детского сада" }
    shrub: { source: ppm_743_t3_6_1, row: "Наружная стена школьного здания или здания детского сада" }
    lawn:  { source: practice }
  slope_toe:
    tree:  { source: ppm_743_t3_6_1, row: "Подошва откоса, террасы и др." }
    shrub: { source: ppm_743_t3_6_1, row: "Подошва откоса, террасы и др." }
    lawn:  { source: practice }

# Требования к самим посадкам одного вида (минимальное расстояние между
# растениями одного типа + условный радиус кроны для проверки непересечения).
# ВАЖНО: min_distance_m — это ещё и шаг сетки кандидатов в candidates.py.
# canopy_radius_m — реальный радиус кроны, которым greedy_select буферизует
# каждую точку и проверяет пересечение с уже отобранными (placement.py).
# tree_default даёт диаметр кроны 5.0 м — ровно верхняя граница, на которую
# рассчитана таблица 9.1 СП 42.13330.2016 (примечание 1: «нормы относятся к
# деревьям с диаметром кроны не более 5 м и должны быть увеличены для деревьев
# с кроной большего диаметра»). То есть отступы из таблицы применимы к этой
# посадке без увеличения — совпадение не случайное, но и не выведенное из
# норматива: сам интервал между деревьями таблица 9.1 не нормирует.
# У shrub исходно было min_distance_m=1.0, canopy_radius_m=0.5 (диаметр кроны =
# шагу сетки => отбор почти ничего не отсеивал, ~2700 шт. на демо-территории
# 100×80м — сплошной ковёр). Поднято до 3.0/1.5, то же отношение 2:1.
species_spacing:
  tree_default:  { min_distance_m: 5.0, canopy_radius_m: 2.5 }
  shrub_default: { min_distance_m: 3.0, canopy_radius_m: 1.5 }

# Минимальная площадь полигона (кв. м), чтобы вообще рассматривать его как
# кандидата для газона/сквера (отсекает мусорные узкие обрезки). Не норматив.
min_candidate_area_m2:
  lawn: 4.0
  shrub: 1.0
  tree: 3.0

# Отступ (в метрах) от границы самого участка — territory.buffer(-margin) в
# buffers.buildable_area() перед вычитанием остального. Это геометрически
# другая операция, чем setbacks_m: там раздувается препятствие, здесь
# сжимается сама территория. Нормативом не установлен ни в одном из
# доступных актов — источник practice, по масштабу как отступ от стены здания.
territory_margin_m:
  tree: 5.0
  shrub: 1.5
  lawn: 0.5

# Коэффициенты пригодности зонирования для эвристического скоринга (0..1).
# Это НЕ норматив и не влияет на допустимость — только на ранжирование уже
# допустимых мест (см. docs/decision_log.md о границе между «можно ли здесь»
# и «почему именно здесь»).
zoning_suitability:
  residential: 0.9
  recreational: 1.0
  public: 0.8
  industrial: 0.3
  transport: 0.1
  unknown: 0.5
