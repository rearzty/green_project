# Нормативные отступы посадок от инженерных сетей и параметры посадок.
# Источник значений: текст задания хакатона (СП 42.13330.2016, ПП Москвы №743-ПП,
# МГСН/ПП Москвы №623-ПП). Значения черновые — TODO: проверить точные пункты
# нормативов по полному тексту ТЗ после его открытия 15.09.2026.

# Минимальный отступ (в метрах) от объекта инженерной сети до посадки данного типа.
# 0.0 означает "норматив не ограничивает" (не значит "можно вплотную").
setbacks_m:
  heat_network:      { tree: 2.0, shrub: 1.5, lawn: 0.0 }   # теплосеть
  water_pipe:        { tree: 2.0, shrub: 1.5, lawn: 0.0 }   # водопровод
  sewer:             { tree: 1.5, shrub: 1.0, lawn: 0.0 }   # канализация/водосток
  gas_pipe:          { tree: 2.0, shrub: 1.5, lawn: 0.0 }   # газопровод
  cable_line:        { tree: 1.5, shrub: 1.0, lawn: 0.0 }   # силовой/слаботочный кабель
  power_line_corridor: { tree: 3.0, shrub: 2.0, lawn: 0.0 } # охранная зона ЛЭП (ориентировочно)
  building:          { tree: 5.0, shrub: 1.5, lawn: 0.0 }   # отступ от стен зданий
  road:              { tree: 2.0, shrub: 1.0, lawn: 0.0 }   # проезжая часть/бордюр

# Требования к самим посадкам одного вида (минимальное расстояние между
# растениями одного типа + условный радиус кроны для проверки непересечения).
species_spacing:
  tree_default:  { min_distance_m: 5.0, canopy_radius_m: 2.5 }
  shrub_default: { min_distance_m: 1.0, canopy_radius_m: 0.5 }

# Минимальная площадь полигона (кв. м), чтобы вообще рассматривать его как
# кандидата для газона/сквера (отсекает мусорные узкие обрезки).
min_candidate_area_m2:
  lawn: 4.0
  shrub: 1.0
  tree: 3.0

# Коэффициенты пригодности зонирования для эвристического скоринга (0..1).
zoning_suitability:
  residential: 0.9
  recreational: 1.0
  public: 0.8
  industrial: 0.3
  transport: 0.1
  unknown: 0.5
