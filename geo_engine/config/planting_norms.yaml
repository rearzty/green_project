# Нормативные отступы посадок от инженерных сетей и параметры посадок.
# Источник значений: текст задания хакатона (СП 42.13330.2016, ПП Москвы №743-ПП,
# МГСН/ПП Москвы №623-ПП). Значения черновые — TODO: проверить точные пункты
# нормативов по полному тексту ТЗ после его открытия 15.09.2026.

# Минимальный отступ (в метрах) от объекта инженерной сети до посадки данного типа.
# 0.0 означает "норматив не ограничивает" (не значит "можно вплотную").
# lawn ниже — небольшие ненулевые значения (0.3-0.5м), не 0.0: газон корнями
# не повреждает сети/фундамент так, как дерево, поэтому формального
# норматива-отступа для него в СП обычно нет, но 0 выглядит и на практике
# неверно — нужен минимальный зазор для доступа к колодцам/люкам сетей и
# отмостки вдоль стены здания. Тоже черновик, ждёт сверки 15.09, как и
# остальные значения в этом файле.
setbacks_m:
  heat_network:      { tree: 2.0, shrub: 1.5, lawn: 0.3 }   # теплосеть
  water_pipe:        { tree: 2.0, shrub: 1.5, lawn: 0.3 }   # водопровод
  sewer:             { tree: 1.5, shrub: 1.0, lawn: 0.3 }   # канализация/водосток
  gas_pipe:          { tree: 2.0, shrub: 1.5, lawn: 0.5 }   # газопровод — газ обычно требует более широкой зоны предосторожности
  cable_line:        { tree: 1.5, shrub: 1.0, lawn: 0.3 }   # силовой/слаботочный кабель
  power_line_corridor: { tree: 3.0, shrub: 2.0, lawn: 0.0 } # охранная зона ЛЭП (ориентировочно) — газон под ЛЭП обычно и есть рекомендуемое покрытие (в отличие от деревьев), поэтому 0 тут осознанно, не забыли
  building:          { tree: 5.0, shrub: 1.5, lawn: 0.5 }   # отступ от стен зданий — примерно ширина отмостки
  road:              { tree: 2.0, shrub: 1.0, lawn: 0.3 }   # проезжая часть/бордюр

# Требования к самим посадкам одного вида (минимальное расстояние между
# растениями одного типа + условный радиус кроны для проверки непересечения).
# ВАЖНО: min_distance_m — это ещё и шаг сетки кандидатов в candidates.py
# (generate_point_candidates сэмплирует buildable_area именно с этим шагом).
# canopy_radius_m — реальный радиус кроны, которым greedy_select буферизует
# каждую точку и проверяет пересечение с уже отобранными (placement.py) —
# отбор по факту "работает" только если canopy_radius_m даёт при пересечении
# кругов реальное отсеивание соседей по сетке, а не просто определяет размер
# кружка на карте. У shrub исходно было min_distance_m=1.0, canopy_radius_m=0.5
# (диаметр кроны = шагу сетки => круги едва касаются, отбор почти ничего не
# отсеивал, получали ~2700 шт. на демо-территории 100×80м — сплошной ковёр).
# Теперь min_distance_m=2×canopy_radius_m, как и у tree (5.0=2×2.5) — реальный
# радиус кроны куста поднят с 0.5м (нереалистично мелко для взрослого куста)
# до 1.5м, отбор по пересечению кругов начинает по-настоящему отсеивать
# сетку (~300 шт. вместо ~2700 на той же территории — план остаётся читаемым
# и редактируемым вручную). Сам факт "точка на каждый куст" (не полигон-
# массив, как lawn) — осознанное упрощение MVP, см. decision_log.md.
species_spacing:
  tree_default:  { min_distance_m: 5.0, canopy_radius_m: 2.5 }
  shrub_default: { min_distance_m: 3.0, canopy_radius_m: 1.5 }

# Минимальная площадь полигона (кв. м), чтобы вообще рассматривать его как
# кандидата для газона/сквера (отсекает мусорные узкие обрезки).
min_candidate_area_m2:
  lawn: 4.0
  shrub: 1.0
  tree: 3.0

# Коэффициенты пригодности зонирования для эвристического скоринга (0..1).
zoning_suitability:
  residential: 0.9
  recreational: 1.0
  public: 0.8
  industrial: 0.3
  transport: 0.1
  unknown: 0.5
