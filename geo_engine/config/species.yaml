# Каталог пород: не косметика, а вход в расчёт.
#
# Раньше здесь был плоский список правдоподобных названий, который
# pipeline_service присваивал уже расставленным точкам постфактум. После
# сверки с нормативами так нельзя: и отступ, и интервал зависят от породы.
#
#   * МГСН 1.02-02, п. 4.2.8 — отступ от теплотрассы задан списком пород:
#     «липу, клен, сирень, жимолость — ближе 2 м, тополь, боярышник,
#     кизильник, дерен, лиственницу, березу — ближе 3-4 м»;
#   * 743-ПП, табл. 3.6.1, прим. 3 — «деревья с широкой кроной (липа, клен,
#     дуб, каштан, тополь и др.), затеняющие жилые помещения, должны сажаться
#     не ближе 10 м от здания»;
#   * 743-ПП, табл. 3.6.1, прим. 1 и СП 42.13330.2016, табл. 9.1, прим. 1 —
#     «приведенные нормативы относятся к деревьям с диаметром кроны не более
#     5 м и должны быть соответственно увеличены для деревьев большего
#     диаметра»;
#   * МГСН 1.02-02, п. 4.2.9.2 — интервал между стволами по классу кроны:
#     8-10 м широкая, 5-6 м средняя, 3-4 м узкая.
#
# ПРАВИЛО ВЫБОРА ЧИСЛА ИЗ ДИАПАЗОНА, одно на весь файл: берётся то значение,
# при котором нарушить норму нельзя. Для отступа («не ближе 3-4 м») это
# верхняя граница — 4.0; для интервала («расстояния 8-10 м», то есть минимум
# 8) это нижняя — 8.0. Оба выбора означают «гарантированно в пределах нормы»,
# несмотря на то что один раз это max, а другой min.
#
# Что здесь НЕ из нормативов и помечено соответственно: числовой диаметр кроны
# (в актах названы только словесные классы) и отнесение к классу пород, прямо
# в актах не перечисленных. Это инженерная оценка, а не норма.

# Перечень инвазивных видов (369-ПП от 03.03.2026, приложение 1), дословно.
# Вид отсюда не может быть предложен к посадке — проверяется тестом.
# Список нужен целиком, а не только по совпадающим с нашим ассортиментом:
# он же используется, чтобы пометить существующие посадки на чертеже.
invasive:
  - { ru: "Айлант высочайший", la: "Ailanthus altissima", group: 1 }
  - { ru: "Борщевик Сосновского", la: "Heracleum sosnowskyi", group: 1 }
  - { ru: "Золотарник канадский", la: "Solidago canadensis", group: 1 }
  - { ru: "Золотарник гигантский", la: "Solidago gigantea", group: 1 }
  - { ru: "Люпин многолистный", la: "Lupinus polyphyllus", group: 1 }
  - { ru: "Рейнутрия", la: "Reynoutria ssp.", group: 1 }
  - { ru: "Клен ясенелистный", la: "Acer negundo", group: 2 }
  - { ru: "Аморфа кустарниковая", la: "Amorpha fruticosa", group: 3 }
  - { ru: "Девичий виноград", la: "Parthenocissus inserta", group: 3 }
  - { ru: "Дерен белый", la: "Cornus albus", group: 3 }
  - { ru: "Дуб красный", la: "Quercus rubra", group: 3 }
  - { ru: "Ирга колосистая", la: "Amelanchier spicata", group: 3 }
  - { ru: "Ирга ольхолистная", la: "Amelanchier alnifolia", group: 3 }
  - { ru: "Облепиха крушиновидная", la: "Hippophae rhamnoides", group: 3 }
  - { ru: "Орех маньчжурский", la: "Juglans mandshurica", group: 3 }
  - { ru: "Пузыреплодник калинолистный", la: "Physocarpus opulifolius", group: 3 }
  - { ru: "Робиния псевдоакация (белая акация)", la: "Robinia pseudoacacia", group: 3 }
  - { ru: "Роза морщинистая (шиповник морщинистый)", la: "Rosa rugosa", group: 3 }
  - { ru: "Рябинник рябинолистный", la: "Sorbaria sorbifolia", group: 3 }
  - { ru: "Черемуха виргинская", la: "Prunus virginiana", group: 3 }
  - { ru: "Ясень пенсильванский", la: "Fraxinus pennsylvanica", group: 3 }
  - { ru: "Белокопытник гибридный", la: "Petasites hybridus", group: 4 }
  - { ru: "Вероника нитевидная", la: "Veronica filiformis", group: 4 }
  - { ru: "Мелколепестник канадский", la: "Erigeron canadensis", group: 4 }
  - { ru: "Недотрога железконосная", la: "Impatiens glandulifera", group: 4 }
  - { ru: "Недотрога мелкоцветковая", la: "Impatiens parviflora", group: 4 }
  - { ru: "Подсолнечник клубневой (топинамбур)", la: "Helianthus tuberosus", group: 4 }
  - { ru: "Прилипало пристающее", la: "Adenocaulon adhaerescens", group: 4 }
  - { ru: "Цицания широколистная", la: "Zizania latifolia", group: 4 }
  - { ru: "Череда олиственная", la: "Bidens frondosa", group: 4 }

# Интервал между стволами по классу кроны (МГСН 1.02-02, п. 4.2.9.2) —
# нижняя граница каждого диапазона, см. правило выбора выше.
crown_spacing_m:
  wide: 8.0     # 8-10 м
  medium: 5.0   # 5-6 м
  narrow: 3.0   # 3-4 м

# Диаметр кроны, с которого нормативные отступы полагается увеличивать
# (743-ПП табл. 3.6.1 прим. 1; СП 42.13330.2016 табл. 9.1 прим. 1).
crown_reference_diameter_m: 5.0

tree:
  - name: "Липа мелколистная"
    crown: wide
    crown_diameter_m: 8.0
    heat_network_min_m: 2.0      # МГСН 4.2.8, названа явно
    shades_windows: true         # 743-ПП табл. 3.6.1 прим. 3, названа явно
  - name: "Клён остролистный"
    crown: wide
    crown_diameter_m: 8.0
    heat_network_min_m: 2.0      # МГСН 4.2.8, названа явно («клен»)
    shades_windows: true         # 743-ПП прим. 3, названа явно
  - name: "Дуб черешчатый"
    crown: wide
    crown_diameter_m: 10.0
    shades_windows: true         # 743-ПП прим. 3, названа явно («дуб»)
    # В МГСН 4.2.8 дуб не назван — спец-отступа от теплосети нет,
    # применяется общий из planting_norms.yaml.
  - name: "Берёза повислая"
    crown: medium
    crown_diameter_m: 5.0
    heat_network_min_m: 4.0      # МГСН 4.2.8: «береза — ближе 3-4 м», взята верхняя граница
  - name: "Рябина обыкновенная"
    crown: narrow
    crown_diameter_m: 4.0
    # Ни в одном из доступных актов поимённо не названа.

shrub:
  # Ассортимент из 515-ПП (Базовые требования к благоустройству территории
  # жилой застройки, таблица 5 приложения) — официальный перечень, а не
  # придуманный. Из него исключена «Роза ругоза»: 515-ПП её рекомендует, но
  # 369-ПП (2026) вносит её же в инвазивные как «Роза морщинистая, Rosa
  # rugosa», и более поздний акт главнее.
  - name: "Сирень обыкновенная"
    crown: medium
    crown_diameter_m: 2.5
    heat_network_min_m: 2.0      # МГСН 4.2.8, названа явно («сирень»)
    density_per_m2: 1.0          # 515-ПП табл. 5: «группы, 1 штука/кв.м»
  - name: "Спирея серая"
    crown: narrow
    crown_diameter_m: 1.2
    density_per_m2: 2.5          # 515-ПП табл. 5: «2-3 штуки/кв.м»
  - name: "Спирея японская"
    crown: narrow
    crown_diameter_m: 0.8
    density_per_m2: 3.0
  - name: "Спирея Бумальда"
    crown: narrow
    crown_diameter_m: 0.8
    density_per_m2: 3.0
  - name: "Снежноягодник белый"
    crown: medium
    crown_diameter_m: 1.5
    density_per_m2: 2.5
  - name: "Чубушник венечный"
    crown: medium
    crown_diameter_m: 2.0
    density_per_m2: 2.0
  - name: "Лапчатка кустарниковая"
    crown: narrow
    crown_diameter_m: 1.0
    density_per_m2: 3.0
  - name: "Барбарис Тунберга"
    crown: narrow
    crown_diameter_m: 0.8
    density_per_m2: 3.0
  - name: "Можжевельник казацкий"
    crown: narrow
    crown_diameter_m: 1.5
