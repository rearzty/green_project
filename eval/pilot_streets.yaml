# Пилотный датасет организаторов (в репозиторий не входит): что подавать на
# вход генератору по каждой улице и где лежат деревья проектировщика —
# эталон для scripts/evaluate.py и обучения ml_scoring/designer_model.py.
#
# Пути — относительно каталога «Пилотный проект 20 улиц»
# (переменная GREENPROJECT_PILOT_DATA или --pilot).
#
# input — папка генплана (главный чертёж + внешние ссылки), та же, что
#   брали аудиты в docs/worklog.md.
# reference — посадочный/разбивочный чертёж из «Проектного решения»:
#   layer — регулярное выражение по имени слоя INSERT-а дерева,
#   block — необязательный фильтр по имени блока.
# Улицы без reference оцениваются только по метрикам без эталона.
#
# Кустарник в эталон не взят: его рисуют то блоками, то полилиниями
# живой изгороди, и единого способа достать его нет.

streets:
  - id: olimp
    name: "1. Олимпийская деревня"
    input: "1. Олимпийская деревня/Исходные данные/10000176_Генплан_Олимп - Standard"
    reference:
      file: "1. Олимпийская деревня/Проектное решение/Олимпийская_посадочный.dwg"
      layer: "^(PLNT_TREE_|PL_TREES_)"

  - id: peschany
    name: "2. Песчаный переулок"
    input: "2. Песчаный переулок/Генеральный план редформат"

  - id: parkovaya3
    name: "3. 3-я Парковая"
    input: "3. 3-я Парковая/Исходные данные/10001759_3-я Парковая ул"

  - id: kharkovskaya
    name: "4. Харьковская улица"
    input: "4. Харьковская улица/Исходные данные/Генплан Харьковская"
    reference:
      file: "4. Харьковская улица/Проектное решение/DWG/Харьковская ул_Посадочный+.dwg"
      layer: "^! ПР ДЕРЕВЬЯ$"

  - id: bagritskogo
    name: "5. Багрицкого улица"
    input: "5. Багрицкого улица/Исходные данные/10000450_ул Багрицкого_ГП и ПБ"
    reference:
      file: "5. Багрицкого улица/Проектное решение/DWG/01_ГП ул Багрицкого_Озеленение.dwg"
      layer: "^PL_TREES_"

  - id: kamchatskaya
    name: "6. Камчатская улица"
    input: "6. Камчатская улица/Исходные данные"
    # Эталон не используется: граница работ во входе (3,5 га) не совпадает с
    # площадью посадочного чертежа — деревья проектировщика в среднем в 34 м
    # от неё, внутри ни одного. Оставлено, чтобы не искать заново.
    reference_unaligned:
      file: "6. Камчатская улица/Проектное решение/dwg./Катчатская_Посадочный.dwg"
      layer: "^! ПР ДЕРЕВЬЯ$"

  - id: lodochnaya
    name: "8. Лодочная"
    input: "8. Лодочная/Исходные данный/06_Л_Генеральный план М 1_500 - Standard"

  - id: izmailovskaya
    name: "9. Измайловская площадь"
    input: "9. Измайловская площадь /Исходные данные/01_25_ДВ_ВАО_10001620_АПОТ - Standard"
    reference:
      file: "9. Измайловская площадь /Проектное решение/DWG/ИТОГ_Разбивочно-посадочный - Standard/Разбивочно-посадочный.dwg"
      layer: "^DENDRO_TREE_"

  - id: stary_gai
    name: "10. Старый Гай ул"
    input: "10. Старый Гай ул/ИСХОДНЫЕ ДАННЫЙ/04_10001957_Старый Гай_ГЧ - Standard"
    reference:
      file: "10. Старый Гай ул/Проектное решение/DWG/улица Старый Гай_Посадочный.dwg"
      layer: "^\\(ГП\\)Посадочное место$"

  - id: natashinsky
    name: "12. Наташинский пр-д"
    input: "12. Наташинский пр-д(Дорога от ул. Борисовские пруды до пр.пр5396(вокруг м-р Братеево))/Исходные данные/АПОТ Наташинский пр.16.02.26"
    reference:
      file: "12. Наташинский пр-д(Дорога от ул. Борисовские пруды до пр.пр5396(вокруг м-р Братеево))/Проектное решение/DWG/Посадочный план1.dwg"
      layer: "^\\(ГП\\)Посадочное место$"

  - id: kharkovsky_pr
    name: "13. Харьковский проезд"
    input: "13. Харьковский проезд/Исходные данные/АПОТ Харьковский проезд вер.8 - Standard"
    reference:
      file: "13. Харьковский проезд/Проектное решение/DWG/Харьковский пр-д_Посадочный+++.dwg"
      layer: "^\\(ГП\\)Проект деревья$"

  - id: kulikovskaya
    name: "14. Куликовская улица"
    input: "14. Куликовская улица/Исходные данные/10003742_Куликовская улица"
    reference:
      file: "14. Куликовская улица/Проектные решения/DWG/РЧ посадок линейный.dwg"
      layer: "^Новый_Растения (?!.*За границей)"
      block: "^дерево"

  - id: pontryagina
    name: "15. Академика Понтрягина"
    input: "15. Академика Понтрягина/Исходные данные/05_ЮЗАО_10003825_Академика Понтрягина улица - Standard (1)"
    reference:
      file: "15. Академика Понтрягина/Проектное решение/г. Москва ул. Академика Понтрягина от 01.09.26г/DWG/Генеральный план.dwg"
      layer: "^Новый_Растения фр"
      block: "^(дерево|Модель Дерева)"

  - id: berzarina
    name: "16. улица Берзарина"
    input: "16. улица Берзарина/Исходные данные"

  - id: gruzinskaya
    name: "17. Грузинская М ул"
    input: "17. Грузинская М ул/Исходные данные/10001169_Грузинская М. ул"
    reference:
      file: "17. Грузинская М ул/Проектное решение/разбивочно-посадочный чертеж/разбивочно_посадочный чертеж..dwg"
      layer: "^ГП_посадочный$"
      block: "^Дерево_.*_Пр"

  - id: kustanaiskaya
    name: "18. Кустанайская улица"
    input: "18. Кустанайская улица/Исходные данные/05_10004141_Генплан_Кустанайская ул. - Standard"

  - id: pryadilnaya2
    name: "19. 2-я Прядильная"
    input: "19. 2-я прядильная/Исходные данные/04_10001899-АПОТ-ГЧ - Standard (1)"

  - id: makeeva
    name: "20. Макеева С. ул"
    input: "20. Макеева С. ул/Исходные данные/Генплан/10001121 - Standard"
