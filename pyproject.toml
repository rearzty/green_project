[project]
name = "greenproject"
version = "0.1.0"
description = "AI-assisted urban greening layout planner (LCT 2026 hackathon)"
requires-python = ">=3.11,<3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "geopandas>=1.0",
    "shapely>=2.0",
    "pyproj>=3.6",
    "ezdxf>=1.3",
    "scikit-learn>=1.5",
    "joblib>=1.4",
    "numpy>=1.26",
    "pyyaml>=6.0",
    "python-multipart>=0.0.9",
    # Outbound call to Groq's API from assistant_service.py (Юна) -- not just
    # a test dependency anymore, so it moved out of [dev] below.
    "httpx>=0.27",
    # Rasterizes the loaded source drawing to a PNG backdrop for the 2D map
    # (layer_raster.py) -- see its docstring for why vector rendering doesn't
    # work at real scale.
    "pillow>=10.4",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
]

[tool.setuptools.packages.find]
include = ["backend*", "geo_engine*", "ml_scoring*"]
