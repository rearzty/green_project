services:
  backend:
    build:
      context: ..
      dockerfile: infra/Dockerfile.backend
    restart: on-failure
    environment:
      GREENPROJECT_CORS_ORIGINS: '["http://localhost:3000", "http://127.0.0.1:3000"]'
      # Юна (assistant_service.py) -- read from the host's own environment
      # (docker compose substitutes ${VAR} from the shell/.env next to this
      # file), not hardcoded, so the key never lives in version control.
      # Unset on the host -> empty string here -> settings.groq_api_key is
      # falsy -> the assistant endpoint returns a clear "not configured"
      # error instead of the feature silently misbehaving.
      GREENPROJECT_GROQ_API_KEY: ${GREENPROJECT_GROQ_API_KEY:-}
    ports:
      - "8000:8000"

  frontend:
    build:
      context: ..
      dockerfile: infra/Dockerfile.frontend
    # No NEXT_PUBLIC_API_URL here -- Next.js inlines NEXT_PUBLIC_* at `next
    # build` time (inside Dockerfile.frontend's `npm run build` layer), which
    # runs before this `environment:` block exists at all (that's `docker
    # run`, after the image is already built) -- setting it here was always
    # a no-op. frontend/lib/api.ts derives the API host from the page's own
    # hostname at runtime instead, which also means it doesn't need to know
    # this machine's LAN IP up front.
    ports:
      - "3000:3000"
    depends_on:
      - backend
