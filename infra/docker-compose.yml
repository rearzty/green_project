services:
  db:
    image: postgis/postgis:16-3.4
    environment:
      POSTGRES_USER: greenproject
      POSTGRES_PASSWORD: greenproject
      POSTGRES_DB: greenproject
    ports:
      - "5432:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U greenproject"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ..
      dockerfile: infra/Dockerfile.backend
    environment:
      GREENPROJECT_DATABASE_URL: postgresql+psycopg2://greenproject:greenproject@db:5432/greenproject
      GREENPROJECT_CORS_ORIGINS: '["http://localhost:3000"]'
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build:
      context: ..
      dockerfile: infra/Dockerfile.frontend
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8000
    ports:
      - "3000:3000"
    depends_on:
      - backend

volumes:
  db_data:
